name: 🐞 Ошибка
description: Что-то работает не так, как должно
labels: [ошибка]
body:
  - type: input
    id: version
    attributes:
      label: Версия Grimsby Converter
      description: «Настройки» — версия под названием программы
      placeholder: например, 1.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы конвертировали (формат файла и во что), что пошло не так. Если можно — приложите скриншот.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Как должно было быть
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: например, Windows 11
